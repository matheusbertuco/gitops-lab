apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-routes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/matheusbertuco/gitops-lab.git
    targetRevision: main
    path: infrastructure/gateway-routes
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
