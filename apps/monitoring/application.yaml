apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.21.0

    helm:
      releaseName: monitoring

      valueFiles:
        - $values/monitoring/values.yaml

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 87.21.0

      helm:
        releaseName: monitoring
        valueFiles:
          - $values/monitoring/values.yaml

    - repoURL: https://github.com/matheusbertuco/gitops-lab.git
      targetRevision: main
      ref: values

  destination:
    name: kind-gitops
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
