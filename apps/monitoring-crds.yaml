apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-crds
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/matheusbertuco/gitops-lab.git
    targetRevision: main
    path: monitoring/crds

  destination:
    name: kind-gitops
    namespace: monitoring

  syncPolicy:
    automated:
      prune: false
      selfHeal: true

  syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
